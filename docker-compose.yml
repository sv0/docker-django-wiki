---
services:
  wiki:
    image: slavik0/django-wiki
    restart: "always"
    labels:
      traefik.http.routers.web.rule:
        Host(`wiki.svyrydiuk.eu`)
        && !(PathPrefix(`/media`) || PathPrefix(`/static`))
      traefik.http.routers.web.tls: true
      traefik.http.routers.web.tls.certresolver: letsEncrypt
    environment:
      DEBUG: 'false'
      SECRET_KEY: 'secret, pico'
      REDIS_URL: "redis://:@redis:6379/0"
    expose:
      - 8000
    depends_on:
      - redis
    volumes:
      - ${PWD}/data:/app/data
      - ${PWD}/media:/app/media
      - ${PWD}/static:/app/static

  static:
    image: nginx:mainline-alpine-slim
    restart: "always"
    labels:
      traefik.http.routers.static.rule:
        Host(`wiki.svyrydiuk.eu`)
        && (PathPrefix(`/media`) || PathPrefix(`/static`))
      traefik.http.routers.static.tls: true
      traefik.http.routers.static.tls.certresolver: letsEncrypt
    volumes:
      - ${PWD}/media:/usr/share/nginx/html/media
      - ${PWD}/static:/usr/share/nginx/html/static
    ports:
     - "8081:80"
    environment:
     - NGINX_PORT=80

  redis:
    image: redis:7.2.3  # latest as os 2023-11-26
    restart: unless-stopped
    expose:
      - 6379
